# Compiles the OTV sketch on every push and pull request.
# A red X on a PR means the code does not compile.
name: Compile OTV

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:renesas_uno:unor4wifi
          platforms: |
            - name: arduino:renesas_uno
          sketch-paths: |
            - otv
          libraries: |
            - name: Servo
